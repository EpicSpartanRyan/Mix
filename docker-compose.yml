services:
  # Servicio 1: Tu Aplicación Principal en Python 3.14
  main-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: python_main_app
    restart: unless-stopped
    volumes:
      - ./app:/app
    environment:
      - OB_HOST=oceanbase
      - OB_PORT=2881
    depends_on:
      - oceanbase
    networks:
      - app-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Servicio 2: OceanBase Community Edition
  oceanbase:
    image: oceanbase/oceanbase-ce:latest
    container_name: oceanbase_db
    restart: unless-stopped
    ports:
      - "2881:2881"
    environment:
      - MODE=slim
      - OCP_VISIBLE=false
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
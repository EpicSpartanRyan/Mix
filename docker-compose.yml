services:
  # Servicio 1: Tu Aplicación Principal en Python 3.14
  main-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: python_main_app
    restart: unless-stopped
    volumes:
      - ./app:/app
    environment:
      - OB_HOST=oceanbase
      - OB_PORT=2881
      - MILVUS_HOST=milvus-standalone
      - MILVUS_PORT=19530
    depends_on:
      - oceanbase
      - milvus-standalone
    networks:
      - app-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Servicio 2: OceanBase Community Edition
  oceanbase:
    image: oceanbase/oceanbase-ce:latest
    container_name: oceanbase_db
    restart: unless-stopped
    ports:
      - "2881:2881"
    environment:
      - MODE=slim
      - OCP_VISIBLE=false
    networks:
      - app-net

  # ==========================================
  # SERVICIOS PARA MILVUS (con milvusdb/etcd)
  # ==========================================
  
  # Dependencia etcd provista por milvusdb
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: milvus-etcd
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
      - ETCD_ADVERTISE_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
    volumes:
      - etcd-data:/etcd
    command: etcd --data-dir /etcd
    networks:
      - app-net

  # Dependencia: MinIO (Almacenamiento de objetos)
  minio:
    image: minio/minio:latest
    container_name: milvus-minio
    restart: unless-stopped
    environment:
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    volumes:
      - minio-data:/data
    command: minio server /data --console-address ":9001"
    networks:
      - app-net

  # Milvus Standalone
  milvus-standalone:
    image: milvusdb/milvus:latest
    container_name: milvus-standalone
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=milvus-minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

volumes:
  etcd-data:
  minio-data:
  milvus-data:
services:
  # Servicio 1: Tu Aplicación Principal

  #TODO: agregar volumes de emqx, dragonfly, oceanbase
  main-app:
    build:
      context: .
      dockerfile: ./app/Dockerfile
    container_name: python_main_app
    restart: unless-stopped
    command: /start
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app
      - .:/workspaces/Mix:cached
    env_file:
      - .env/.dev-sample
    depends_on:
      - oceanbase
      - milvus-standalone
      - dragonfly
      - emqx
    networks:
      - app-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  celery_worker:
    build:
      context: .
      dockerfile: ./app/Dockerfile
    container_name: celery_worker
    restart: unless-stopped
    command: /start-celeryworker
    volumes:
      - ./app:/app
    env_file:
      - .env/.dev-sample
    depends_on:
      - oceanbase
      - milvus-standalone
      - dragonfly
      - emqx
    networks:
      - app-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  celery_beat:
    build:
      context: .
      dockerfile: ./app/Dockerfile
    container_name: celery_beat
    restart: unless-stopped
    command: /start-celerybeat
    volumes:
      - ./app:/app
    env_file:
      - .env/.dev-sample
    depends_on:
      - oceanbase
      - milvus-standalone
      - dragonfly
      - emqx
    networks:
      - app-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  flower:
    build:
      context: .
      dockerfile: ./app/Dockerfile
    container_name: celery_flower
    restart: unless-stopped
    command: /start-flower
    ports:
      - "5555:5555"
    volumes:
      - ./app:/app
    env_file:
      - .env/.dev-sample
    depends_on:
      - oceanbase
      - milvus-standalone
      - dragonfly
      - emqx
    networks:
      - app-net


  # Servicio Nuevo: EMQX (Broker MQTT Enterprise/Community)
  emqx:
    image: emqx/emqx:latest
    container_name: emqx_broker
    restart: unless-stopped
    ports:
      - "1883:1883"   # MQTT estándar
      - "8083:8083"   # MQTT over WebSockets
      - "8084:8084"   # MQTT over WSS
      - "8883:8883"   # MQTT Secure (TLS)
      - "18083:18083" # Dashboard web
    volumes:
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
    networks:
      - app-net

  # Servicio Nuevo: DragonflyDB (Drop-in replacement de Redis)
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    container_name: dragonfly
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - dragonfly-data:/data
    command: [ "dragonfly", "--logtostderr", "--dir=/data" ]
    networks:
      - app-net

  # ... (OceanBase, etcd, minio y milvus-standalone siguen igual)
  oceanbase:
    image: oceanbase/oceanbase-ce:latest
    container_name: oceanbase_db
    restart: unless-stopped
    ports:
      - "2881:2881"
    environment:
      - MODE=slim
      - OCP_VISIBLE=false
    volumes:
      - oceanbase-data:/root/ob
    networks:
      - app-net

  # ==========================================
  # SERVICIOS PARA MILVUS (con milvusdb/etcd)
  # ==========================================
  
  # Dependencia etcd provista por milvusdb
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: milvus-etcd
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
      - ETCD_ADVERTISE_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
    volumes:
      - etcd-data:/etcd
    command: etcd --data-dir /etcd
    networks:
      - app-net

  # Dependencia: MinIO (Almacenamiento de objetos)
  minio:
    image: minio/minio:latest
    container_name: milvus-minio
    restart: unless-stopped
    environment:
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    volumes:
      - minio-data:/data
    command: minio server /data --console-address ":9001"
    networks:
      - app-net

  # Milvus Standalone
  milvus-standalone:
    image: milvusdb/milvus:latest
    container_name: milvus-standalone
    restart: unless-stopped
    # Redirigimos stderr y stdout a /dev/null
    command: ["sh", "-c", "milvus run standalone > /dev/null 2>&1"]
    environment:
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=milvus-minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

volumes:
  etcd-data:
  minio-data:
  milvus-data:
  oceanbase-data:
  emqx-data:
  emqx-log:
  dragonfly-data:
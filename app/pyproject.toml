[project]
name = "mix-app"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.2",
    "celery>=5.6.3",
    "celery-types>=0.26.0",
    "cupy-cuda13x>=14.2.0",
    "duckdb>=1.5.5",
    "fastapi[standard]>=0.141.1",
    "flower>=2.1.0",
    "mysqlclient>=2.2.8",
    "paho-mqtt>=2.1.0",
    "polars>=1.44.1",
    "pymilvus>=3.0.1",
    "pymysql>=1.2.0",
    "redis>=8.1.0",
    "sqlmodel>=0.0.42",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }
